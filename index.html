
  <!DOCTYPE html>
  <html lang="id">
    <head>
      <meta charset="UTF-8" />
      <meta http-equiv="X-UA-Compatible" content="IE=edge" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="referrer" content="strict-origin-when-cross-origin" />
      <meta name="robots" content="noindex, nofollow" />

      <!-- Preload LCP image untuk menghilangkan render delay -->
      <link rel="preload" as="image" href="/logo_utt.png" fetchpriority="high" />

      <!-- Preconnect untuk YouTube background video -->
      <link rel="preconnect" href="https://www.youtube.com" />
      <link rel="preconnect" href="https://i.ytimg.com" />

      <!-- DNS Prefetch untuk koneksi cepat ke Firebase -->
      <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
      <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
      <link rel="dns-prefetch" href="https://securetoken.googleapis.com" />
      <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />
      <link rel="dns-prefetch" href="https://www.google.com" />

      <title>UTT Report Maintenance</title>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/frontend/main.tsx"></script>
    </body>
  </html>
