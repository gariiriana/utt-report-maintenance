services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env.local
    environment:
      - PORT=8080
    volumes:
      - ./backend:/app:delegated
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - .env.development
    environment:
      - VITE_API_URL=http://localhost:8080/api/
    volumes:
      - .:/app:delegated
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
